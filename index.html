<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Odd Little Shop — Cozy Fantasy Roguelite Battler</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Top Navigation & Brand Header -->
  <header>
    <div class="brand-title">
      <span>🏪</span>
      <span>The Odd Little Shop</span>
      <span style="font-size: 0.8rem; font-weight: normal; opacity: 0.8; margin-left: 8px;">
        5-Lane Cozy Card Battler
      </span>
    </div>
    <div class="nav-controls">
      <button class="btn" onclick="window.app && window.app.showCollectionModal()">
        📚 Collection (30 Cards)
      </button>
      <button class="btn btn-primary" onclick="window.app && window.app.showNewGameModal()">
        ⚔️ New Encounter
      </button>
    </div>
  </header>

  <!-- Main Game Container -->
  <main id="app">
    <!-- Populated dynamically by gameApp.js -->
  </main>

  <!-- ES Module Entrypoint -->
  <script type="module" src="src/ui/gameApp.js"></script>
</body>
</html>
