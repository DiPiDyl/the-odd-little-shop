<!DOCTYPE html>
<html>
<head>
  <title>The Odd Little Shop — Automated Comprehensive Engine Tests</title>
</head>
<body>
  <h1>Engine Verification Results</h1>
  <div id="results">Running tests...</div>

  <script type="module">
    import { DeckManager } from "../src/engine/deckManager.js";
    import { CombatEngine, CombatPhase } from "../src/engine/combatEngine.js";
    import { AIOpponent } from "../src/engine/aiOpponent.js";
    import { createCardInstance } from "../src/engine/cardModel.js";
    import { COZY_COUNTER_CARDS } from "../src/data/cardsCozyCounter.js";
    import { MIDNIGHT_BAZAAR_CARDS } from "../src/data/cardsMidnightBazaar.js";
    import { PackSystem, PACK_TYPES } from "../src/data/packSystem.js";
    import { SaveManager } from "../src/save/saveManager.js";

    const resultsDiv = document.getElementById("results");
    const logs = [];

    function assert(condition, message) {
      if (!condition) {
        throw new Error("FAILED: " + message);
      }
      logs.push("✅ PASS: " + message);
    }

    async function runSuite() {
      try {
        // Test 1: Continuous Deck Loop Reshuffle
        const cards = [
          createCardInstance(COZY_COUNTER_CARDS[0]),
          createCardInstance(COZY_COUNTER_CARDS[1]),
          createCardInstance(COZY_COUNTER_CARDS[2])
        ];
        const dm = new DeckManager(cards);
        assert(dm.drawPile.length === 3, "Initial draw pile has 3 cards");
        
        const drawn1 = dm.drawCards(2);
        assert(drawn1.length === 2, "Drew 2 cards into hand");
        const discarded = dm.discardCardFromHand(drawn1[0].instanceId);
        assert(discarded !== null, "Discarded 1 card to discard pile");

        let reshuffled = false;
        const drawn2 = dm.drawCards(2, () => { reshuffled = true; });
        assert(reshuffled === true, "Continuous Deck Loop auto-reshuffled discard pile!");
        assert(drawn2.length === 2, "Drew both cards without running dry");

        // Test 2: Combat Engine Initialization & 5-Lane Board
        const ai = new AIOpponent("normal");
        const engine = new CombatEngine({
          playerShopkeeperId: "cozy_curator",
          enemyShopkeeperId: "midnight_broker",
          playerDeckInstances: COZY_COUNTER_CARDS.map(c => createCardInstance(c)),
          enemyDeckInstances: MIDNIGHT_BAZAAR_CARDS.map(c => createCardInstance(c)),
          aiController: ai
        });

        engine.startBattle();
        assert(engine.playerLanes.length === 5, "Player has 5 combat lanes");
        assert(engine.enemyLanes.length === 5, "Enemy has 5 combat lanes");
        assert(engine.phase === CombatPhase.PLAYER_PLANNING, "Engine enters PLAYER_PLANNING phase");

        // Test 3: Card Placement on Lane
        const armchairData = COZY_COUNTER_CARDS.find(c => c.id === "cozy_armchair");
        const armchair = createCardInstance(armchairData);
        engine.player.deckManager.hand.push(armchair);
        engine.player.energy = 5;

        const playSuccess = engine.playCard(true, armchair.instanceId, 0);
        assert(playSuccess === true, "Placed Old Armchair in Lane 1");
        assert(engine.playerLanes[0].id === "cozy_armchair", "Lane 1 correctly contains Old Armchair");

        // Test 4: Selling Mechanic & "When Sold" Trigger
        engine.player.health = 25; // Damage slightly to test heal
        const initialCoins = engine.playerCoins;
        const initialHp = engine.player.health;
        const sellCheck = engine.canSellUnit(true, 0);
        assert(sellCheck.allowed === true, "Allowed to sell unit during planning phase");

        const sellSuccess = engine.sellUnit(true, 0);
        assert(sellSuccess === true, "Successfully sold Old Armchair");
        assert(engine.playerLanes[0] === null, "Lane 1 is now empty after sale");
        assert(engine.playerCoins > initialCoins, `Earned Coins from sale (${engine.playerCoins} coins)`);
        assert(engine.player.health === initialHp + 2, "Old Armchair 'When Sold' triggered (+2 HP heal)");

        // Test 5: Selling Limit (1 sale per round)
        const candleData = COZY_COUNTER_CARDS.find(c => c.id === "cozy_candle");
        const candle = createCardInstance(candleData);
        engine.player.deckManager.hand.push(candle);
        engine.player.energy = 5;
        engine.playCard(true, candle.instanceId, 1);

        const secondSellCheck = engine.canSellUnit(true, 1);
        assert(secondSellCheck.allowed === false, "Enforced 1 sale per round limit!");

        // Test 6: AI Opponent Planning
        engine.phase = CombatPhase.OPPONENT_PLANNING;
        engine.enemy.energy = 5;
        await ai.takeTurnAsync(engine);
        // Verify enemy took actions or has board presence
        const enemyUnits = engine.enemyLanes.filter(u => u !== null);
        assert(enemyUnits.length > 0 || engine.enemy.energy < 5, "AI Opponent actively planned and spent energy/deployed stock!");

        // Test 7: Pack Generation & Duplicate Conversion to Scrap
        const existingCopies = { cozy_armchair: 2, cozy_candle: 1 };
        const packResults = PackSystem.openPack("cozy_pack", existingCopies);
        assert(packResults.length === 5, "Booster pack opened exactly 5 cards");
        assert(packResults[4].card.rarity === "rare" || packResults[4].card.rarity === "epic" || packResults[4].card.rarity === "legendary", "Guaranteed Rare or higher in Slot 5");

        // Test 8: Save/Load Schema V2
        const saveState = SaveManager.getInitialSaveState();
        assert(saveState.version === 2, "Save state uses Version 2 schema");
        assert(saveState.decks.cozy_counter.length === 20, "Cozy Counter deck has exactly 20 cards");
        assert(saveState.decks.midnight_bazaar.length === 20, "Midnight Bazaar deck has exactly 20 cards");

        logs.push("🎉 ALL 8 OVERHAUL ENGINE TESTS PASSED SUCCESSFULLY!");
        resultsDiv.innerHTML = logs.map(l => `<p>${l}</p>`).join("");
        document.title = "TESTS_PASSED";
      } catch (err) {
        logs.push("❌ " + err.message);
        resultsDiv.innerHTML = logs.map(l => `<p style="color:red;">${l}</p>`).join("");
        document.title = "TESTS_FAILED";
      }
    }

    runSuite();
  </script>
</body>
</html>
